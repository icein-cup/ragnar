models:
  # Measured on 20-40 in-corpus HybridQA questions replayed over identical
  # retrieved contexts (eval/replay_answer.py), scored by answer_coverage —
  # correct answers over ALL answerable questions, so refusing counts against
  # the model. See eval/metrics.py for why answer_accuracy alone misleads.
  #
  # Head to head on the SAME 20 questions and 10 probes (seed 42), which is
  # the only fair comparison — earlier numbers used different denominators:
  #
  #                                   coverage   probe refusal   sec/call
  #   qwen2.5:7b                        0.60         0.90           3
  #   Qwen3.8-27 (thinking, native)     0.70         0.90          20
  #   Qwen3.8-27 (think: false)         0.05          -             8
  #
  # Over the wider 40-question sample: qwen2.5:3b 0.42, qwen2.5:7b 0.47.
  #
  # So the 27b buys +10 points of coverage at identical refusal quality, for
  # ~6x the latency and about 32 GB resident (NOT the 18.2 GB on-disk size).
  # It needs a 48 GB machine and will not load on 32 GB — a real constraint
  # on the "runs on a normal laptop" goal. qwen2.5:7b is the fallback for
  # smaller hosts and gives up roughly a seventh of the answers.
  #
  # Retrieval is not the ceiling here: 96% of answered questions cited a
  # document the question needed. Reading the retrieved text correctly is.
  llm: qwen2.5:7b
  # null omits the "think" field from /api/chat; true and false force a
  # thinking model's reasoning pass on or off.
  #
  # DO NOT set this to false for a thinking model. The reasoning is not
  # decoration this pipeline can discard — it is how the model reaches an
  # answer at all. Measured on Qwen3.8-27-mlx-nv4-thinking, 20 in-corpus
  # HybridQA questions replayed over identical retrieved contexts:
  #
  #   think: false   answer_coverage 0.05   refused 38 of 40, with a bare
  #                                         "NO_ANSWER" and no explanation
  #   think: null    answer_coverage 0.70   (its native mode)
  #
  # The two it answered with thinking off were both correct, so it is not
  # incapable — forcing content-only output makes it decline instead of
  # reason. Cost of leaving thinking on: about 16s per answering call.
  #
  # false remains right for a NON-thinking model that somehow exposes the
  # flag, and null is the safe default: it cannot surprise a model we have
  # not measured.
  think: null
  # Pinned so a run is reproducible. Query generation samples at a non-zero
  # temperature (agentic.query_temperature), so without this two eval runs
  # over identical inputs would disagree and no comparison would mean much.
  seed: 42
  embedding: bge-m3
  embedding_dim: 1024
  reranker: BAAI/bge-reranker-v2-m3

chunking:
  strategy: structural   # structural | semantic
  target_tokens: 350
  overlap_tokens: 50
  table_rows_per_group: 10
  # Semantic strategy only: how large a similarity drop between consecutive
  # sentences counts as a topic boundary, as a percentile of the document's
  # own drops. Higher = fewer, larger chunks. Overlap does not apply to this
  # strategy — cuts are chosen to land on topic boundaries.
  semantic_breakpoint_percentile: 95

retrieval:
  # UNDER TEST (2026-08-25, Branch D): was candidates=25/top_k=5. Retrieval-
  # only recall (embed+rerank, no generation, 89 HybridQA in-corpus cases):
  # top_k=5 found 67/89 answers, top_k=10/candidates=30 found 71/89 (+4,
  # monotonic — no cases lost at any tier tried). One-generation-call test
  # (base Search, no agentic overhead) confirmed the gain carries into
  # actual answers: correct 24/89->32/89 (+9pts), wrong count flat, probe
  # refusal 0.971->0.886 (a real but modest cost — 3 more of 35 probes
  # wrongly answered). Full 125-case agentic confirmation pending before
  # this is considered settled — see eval/docs/experiment-results.md for the numbers
  # and today's hard-won lesson about not trusting anything short of the
  # full benchmark for a change that touches what the model sees to answer.
  candidates: 30
  top_k: 10
  # NOT VALIDLY CALIBRATED. The --calibrate sweep this value came from was
  # broken: eval/run_eval.py left vector_floor at 0.0, and since the floors
  # are OR'd, every result cleared the gate at every swept floor. The sweep
  # is fixed now but this number has not been re-derived — see eval/README.md.
  #
  # Was 0.6 from Task 25's calibration (only 5 golden-set cases, explicitly
  # flagged there as not production-trustworthy). Real usage against a real
  # uploaded corpus showed a clean gap: out-of-corpus questions scored
  # 0.50-0.503, relevant ones (even a single vague word) scored 0.578+.
  # 0.55 sits in that gap with margin on both sides. Still a stopgap, not a
  # real calibration - see eval/README.md, which needs a much larger golden
  # set before this number should be trusted.
  #
  # That 0.578+ gap does NOT hold on table-heavy corpora: bge-reranker-v2-m3
  # scores markdown table rows as near-neutral (~0.50-0.503, sigmoid of a
  # ~0 logit) against natural-language questions regardless of whether the
  # row is the right answer - "no opinion", not "irrelevant". A result is
  # now kept if EITHER score_floor OR vector_floor below is cleared, so
  # genuinely relevant table rows aren't refused just because the
  # cross-encoder is neutral on tabular text.
  score_floor: 0.55
  # Raw cosine-similarity floor (the embedder's score, before reranking).
  # Rescues content the reranker scores as neutral but the embedder placed
  # clearly near the query. Measured on the real corpus: relevant table
  # rows sat at 0.4494-0.4718 cosine; 0.42 sits just under that with a
  # little margin. Same stopgap caveat as score_floor above - not a real
  # calibration, needs a larger golden set via eval/run_eval.py --calibrate.
  vector_floor: 0.42

storage:
  data_dir: /app/data
  collection: documents

ingestion:
  # Number of parallel worker threads. Each gets its own Docling converter
  # (~1-2 GB model memory). "auto" detects from cgroup memory limit + CPU
  # count; set to an integer to override. # ponytail: N workers = N× converter memory.
  workers: auto
  # RAM budget per worker (GB). Auto divides available memory by this to get
  # the memory-bound worker count. Docling converter ~1-2 GB.
  worker_memory_gb: 2
  # Hard cap on auto-detected worker count.
  max_workers: 8

agentic:
  enable_rewrite: true
  enable_multi_query: true
  enable_multi_hop: true
  enable_self_correction: true
  max_hops: 3
  multi_query_count: 3
  # Temperature for the two calls that emit a retrieval query (query rewrite
  # and multi-query fan-out). Those want lexical variety — three "different
  # ways to ask the same question" generated greedily come out nearly
  # identical, which wastes the fan-out. Answer generation is unaffected and
  # stays deterministic; models.seed keeps runs reproducible regardless.
  query_temperature: 0.7
