[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "docling>=2.0",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sentence-transformers>=3.3",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "reportlab>=4.2",
    # Eval-only: Ragas judged metrics and the OpenAI-compatible judge
    # client. Never imported by the app — this gets installed with the
    # image's `.[dev]` so the eval harness runs inside the container.
    # ragas 0.4.x imports langchain_community.chat_models.vertexai, which
    # was removed in langchain-community 0.4.x — pin below that.
    "ragas==0.4.3",
    "langchain-community<0.4",
    "langchain-openai>=0.3",
    # eval/gen_golden.py imports it directly; do not rely on langchain-openai
    # happening to pull it in.
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ingestion*", "retrieval*", "generation*", "ui*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Ollama and/or Qdrant running",
]
