        - generic [ref=e129]: Confirmed
        - paragraph [ref=e130]: "Increasing parameter count from 7B to 14B produced no measurable change in coverage (0.60 for both) or probe refusal (0.90 for both), at 1.7× the latency and 1.4× the resident memory. The 27B model, evaluated in its native thinking mode, gained 10 coverage points over the 7B baseline but required 32 GB resident memory and approximately 20 seconds per call before any agentic overhead — exceeding the latency budget independent of pipeline cost. Disabling the 27B model's reasoning pass (think: false) reduced coverage to 0.05."
        - paragraph [ref=e131]: qwen2.5:7b was retained as the production model. The prompt-wording change in Section 02 produced a larger coverage gain than doubling parameter count.
