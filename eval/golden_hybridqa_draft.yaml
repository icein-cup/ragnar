# HybridQA sampled multi-hop golden set (DRAFT for review).
# Source: wenhuchen/HybridQA dev.traced.json + wenhuchen/WikiTables-WithLinks tables_tok.
# multihop: true = the answer requires the anchor table AND every listed passage.
# expected_sources = citation labels (document titles) the answerer must surface.
# Traces are filtered (single passage, answer nowhere else in the table), but the
# questions are not: HybridQA phrases them against a table already on screen, so
# some identify nothing on their own ('A 2009 title came out in what month ?').
# Review each entry, then merge accepted ones into eval/golden_set.yaml.
# The out_of_corpus probes at the end are hand-written and survive no re-run of
# load_hybridqa.py — keep them when regenerating, or refusal_accuracy is blind.

